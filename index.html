<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض صوري الشخصية</title>
  <meta name="description" content="معرض صور شخصية يعرض لحظاتي المميزة والذكريات الجميلة." />

  <!-- Google Fonts – Cairo for Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated background -->
  <div class="bg-pattern" aria-hidden="true"></div>

  <div class="page-wrapper">
    <!-- ===== Header ===== -->
    <header class="site-header" id="site-header">
      <div class="container header-inner">
        <a href="#" class="site-logo" id="logo">
          <span class="logo-icon"><img src="logo.png" alt="الشعار" class="logo-img" /></span>
          <span class="logo-text">معرض الصور</span>
        </a>
        <nav class="header-nav" id="main-nav" aria-label="التنقل الرئيسي">
          <a href="#" class="nav-link active" id="nav-home">الرئيسية</a>
          <a href="#gallery" class="nav-link" id="nav-gallery">المعرض</a>
        </nav>
      </div>
    </header>

    <!-- ===== Hero Section ===== -->
    <section class="hero" id="hero-section">
      <div class="container">
        <div class="hero-badge" id="hero-badge">
          <span class="dot"></span>
          <span>مرحبًا بكم</span>
        </div>
        <h1 class="hero-title" id="hero-title">معرض صوري الشخصية</h1>
        <p class="hero-subtitle" id="hero-subtitle">
          هذا الموقع يعرض صوري الشخصية.
          <br />
          لحظات جميلة وذكريات لا تُنسى، محفوظة هنا للأبد.
        </p>
        <div class="hero-divider" aria-hidden="true"></div>
        <div class="ornament" aria-hidden="true">
          <span class="line"></span>
          <span class="diamond"></span>
          <span class="line"></span>
        </div>
      </div>
    </section>

    <!-- ===== Gallery Section ===== -->
    <main class="gallery-section" id="gallery">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title" id="gallery-title">
            <span class="icon">🖼️</span>
            الصور
          </h2>
          <span class="photo-count" id="photo-count">جارٍ التحميل...</span>
        </div>
        <div class="photo-grid" id="photo-grid">
          <!-- Photos are rendered dynamically by JavaScript -->
        </div>
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="site-footer" id="site-footer">
      <div class="container footer-inner">
        <p class="footer-text" id="footer-text">
          صُنع بـ <span class="heart" aria-label="حب">♥</span> — معرض صوري الشخصية
        </p>
        <div class="footer-decor" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </footer>
  </div>

  <script>
    /* ===========================================================
     *  Photo Gallery – Configuration
     *  -----------------------------------------------------------
     *  To add your photos:
     *    1. Place your image files inside the "images" folder.
     *    2. Add each filename to the PHOTOS array below.
     *
     *  Example:
     *    const PHOTOS = [
     *      { file: 'sunset.jpg',   title: 'غروب الشمس' },
     *      { file: 'family.png',   title: 'صورة عائلية' },
     *      { file: 'mountain.jpg', title: 'الجبل' },
     *    ];
     * ===========================================================
     */
    const PHOTOS = [
      { file: '1.jpg', title: 'صورة 1' },
      { file: '2.png', title: 'صورة 2' },
      { file: '3.jpg', title: 'صورة 3' },
      { file: '4.png', title: 'صورة 4' },
      { file: '5.jpg', title: 'صورة 5' },
      { file: '6.png', title: 'صورة 6' },
      { file: '7.jpg', title: 'صورة 7' },
      { file: '8.png', title: 'صورة 8' },
      { file: '9.jpg', title: 'صورة 9' },
      { file: '10.png', title: 'صورة 10' },
      { file: '11.jpg', title: 'صورة 11' },
      { file: '12.jpg', title: 'صورة 12' },
      { file: '13.jpg', title: 'صورة 13' },
      { file: '14.jpg', title: 'صورة 14' },
      { file: '15.jpg', title: 'صورة 15' },
      { file: '16.jpg', title: 'صورة 16' },
      { file: '17.jpg', title: 'صورة 17' },
      { file: '18.jpg', title: 'صورة 18' },
      { file: '19.jpg', title: 'صورة 19' },
      { file: '20.jpg', title: 'صورة 20' },
      { file: '21.jpg', title: 'صورة 21' },
      { file: '22.jpg', title: 'صورة 22' },
      { file: '23.jpg', title: 'صورة 23' },
      { file: '24.jpg', title: 'صورة 24' },
      { file: '25.jpg', title: 'صورة 25' },
      { file: '26.jpg', title: 'صورة 26' },
      { file: '27.jpg', title: 'صورة 27' },

    ];

    /* ===== Render Gallery ===== */
    const grid = document.getElementById('photo-grid');
    const countBadge = document.getElementById('photo-count');

    function renderGallery() {
      grid.innerHTML = '';

      if (PHOTOS.length === 0) {
        countBadge.textContent = 'لا توجد صور بعد';
        grid.innerHTML = `
          <div class="empty-state" id="empty-state">
            <div class="empty-icon">📷</div>
            <h3 class="empty-title">لا توجد صور حتى الآن</h3>
            <p class="empty-desc">
              أضف صورك إلى مجلد <code>images</code> ثم أضف أسماء الملفات
              في مصفوفة <code>PHOTOS</code> داخل ملف <code>index.html</code>.
            </p>
          </div>
        `;
        return;
      }

      // Convert Arabic-Indic numerals
      const toArabicNum = (n) =>
        n.toString().replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

      countBadge.textContent = `${toArabicNum(PHOTOS.length)} صور${PHOTOS.length > 10 ? 'ة' : ''}`;

      PHOTOS.forEach((photo, i) => {
        const frame = document.createElement('div');
        frame.className = 'photo-frame';
        frame.id = `photo-frame-${i + 1}`;
        frame.innerHTML = `
          <div class="frame-corner-bl"></div>
          <div class="photo-wrapper">
            <img
              src="images/${photo.file}"
              alt="${photo.title || 'صورة ' + toArabicNum(i + 1)}"
              loading="lazy"
              draggable="false"
              onclick="return false;"
            />
            <div class="photo-overlay"></div>
          </div>
          <div class="photo-info">
            <span class="photo-name">${photo.title || 'صورة ' + toArabicNum(i + 1)}</span>
            <span class="photo-index">${toArabicNum(i + 1)}</span>
          </div>
        `;
        grid.appendChild(frame);
      });
    }

    renderGallery();

    /* ===== Floating Particles ===== */
    (function spawnParticles() {
      const container = document.querySelector('.bg-pattern');
      const count = 18;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 4 + 2;
        const left = Math.random() * 100;
        const duration = Math.random() * 18 + 14;
        const delay = Math.random() * 20;
        const opacity = Math.random() * 0.25 + 0.05;
        p.style.cssText = `
          width: ${size}px;
          height: ${size}px;
          left: ${left}%;
          background: radial-gradient(circle, rgba(52, 211, 153, ${opacity + 0.2}), rgba(16, 185, 129, ${opacity}));
          animation-duration: ${duration}s;
          animation-delay: ${delay}s;
          box-shadow: 0 0 ${size * 3}px rgba(16, 185, 129, ${opacity});
        `;
        container.appendChild(p);
      }
    })();

    /* ===== Smooth scroll for nav ===== */
    document.querySelectorAll('.nav-link').forEach((link) => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');
        if (href.startsWith('#')) {
          e.preventDefault();
          const target = document.querySelector(href);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          // Update active state
          document.querySelectorAll('.nav-link').forEach((l) => l.classList.remove('active'));
          link.classList.add('active');
        }
      });
    });
  </script>
</body>
</html>
